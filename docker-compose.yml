version: "3.8"

services:
  app:
    build: .
    container_name: symfony24_app
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html/web

  mysql:
    image: mysql:5.7
    container_name: symfony24_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony24
      MYSQL_USER: symfony24
      MYSQL_PASSWORD: symfony24
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: